<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSR - Laporan Harian CSR</title>
  <style>
    :root {
      --bg-outer: #d6dbd6;
      --bg-app: #f4f6f4;
      --primary: #1b5e20;
      --primary-hover: #2e7d32;
      --primary-soft: #e8f5e9;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --danger: #c62828;
      --danger-soft: #ffebee;
      --card-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-outer);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: var(--bg-app);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.08);
    }

    .top-bar {
      background: var(--primary);
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .back-btn {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .top-title {
      font-size: 18px;
      font-weight: 700;
    }

    .content {
      flex: 1;
      padding: 16px;
      padding-bottom: 88px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--card-shadow);
      margin-bottom: 14px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    input[type="text"],
    input[type="date"],
    input[type="url"],
    textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
      background: #fff;
      color: var(--text-main);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-danger {
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid #f5c6cb;
      margin-top: 12px;
    }

    .btn-danger:hover {
      background: #ffcdd2;
    }

    .filter-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 14px;
      padding-bottom: 4px;
    }

    .filter-pill {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      background: #fff;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .report-card {
      background: #fff;
      border-radius: 14px;
      padding: 12px;
      box-shadow: var(--card-shadow);
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .thumb {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      object-fit: cover;
      background: #eef2ef;
      flex-shrink: 0;
    }

    .report-meta {
      flex: 1;
      min-width: 0;
    }

    .report-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .badge {
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
    }

    .report-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
      word-break: break-word;
    }

    .report-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    .detail-photo {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .preview-grid img {
      width: 100%;
      height: 84px;
      object-fit: cover;
      border-radius: 8px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 20;
    }

    .nav-btn {
      background: transparent;
      border: none;
      padding: 10px 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--primary);
    }

    .toast {
      position: fixed;
      bottom: 76px;
      left: 50%;
      transform: translateX(-50%);
      background: #1f2937;
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      z-index: 50;
      display: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }

    .hidden {
      display: none !important;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 32px 16px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="top-bar">
      <button id="btnBack" class="back-btn hidden" aria-label="Kembali">&#8592;</button>
      <div id="topTitle" class="top-title">Beranda</div>
    </div>

    <div class="content">
      <!-- Halaman Beranda / Buat Laporan -->
      <section id="viewHome">
        <div class="card">
          <h3 style="margin-bottom: 12px; color: var(--primary);">Buat Laporan Baru</h3>
          <form id="reportForm">
            <div class="form-group">
              <label for="petugas">Nama Petugas</label>
              <input type="text" id="petugas" value="Muhamad Abdul Azis" required />
            </div>

            <div class="form-group">
              <label for="tanggal">Tanggal Kegiatan</label>
              <input type="date" id="tanggal" required />
            </div>

            <div class="form-group">
              <label for="namaKegiatan">Nama Kegiatan</label>
              <input type="text" id="namaKegiatan" placeholder="Contoh: Penyaluran Bantuan" required />
            </div>

            <div class="form-group">
              <label for="lokasi">Lokasi</label>
              <input type="text" id="lokasi" placeholder="Contoh: Desa Miawa" required />
            </div>

            <div class="form-group">
              <label for="uraian">Uraian Kegiatan</label>
              <textarea id="uraian" placeholder="Tuliskan ringkasan kegiatan CSR..."></textarea>
            </div>

            <div class="form-group">
              <label for="fotoInput">Dokumentasi Foto (Bisa pilih banyak)</label>
              <input type="file" id="fotoInput" accept="image/*" multiple />
              <div id="previewGrid" class="preview-grid"></div>
            </div>

            <button type="submit" id="btnSubmitReport" class="btn btn-primary">Simpan Laporan</button>
          </form>
        </div>
      </section>

      <!-- Halaman Daftar Laporan -->
      <section id="viewReports" class="hidden">
        <div class="filter-row">
          <button class="filter-pill active" data-filter="Semua">Semua</button>
          <button class="filter-pill" data-filter="Disetujui">Disetujui</button>
          <button class="filter-pill" data-filter="Menunggu">Menunggu</button>
          <button class="filter-pill" data-filter="Ditolak">Ditolak</button>
        </div>
        <div id="reportList"></div>
      </section>

      <!-- Halaman Detail Laporan -->
      <section id="viewDetail" class="hidden">
        <div id="detailCard" class="card"></div>
      </section>

      <!-- Halaman Notifikasi -->
      <section id="viewNotif" class="hidden">
        <div class="card">
          <p style="font-size: 14px; color: var(--text-muted);">
            Status sinkronisasi laporan akan tampil di sini setelah pengiriman ke Google Apps Script dilakukan.
          </p>
        </div>
      </section>

      <!-- Halaman Profil & Pengaturan -->
      <section id="viewProfile" class="hidden">
        <div class="card">
          <h3 style="margin-bottom: 10px; color: var(--primary);">Koneksi Google Apps Script (/exec)</h3>
          <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">
            Tempelkan URL Web App dari Google Apps Script agar laporan dan foto tersimpan ke Google Drive &amp; Google Sheets.
          </p>
          <div class="form-group">
            <label for="gasUrlInput">URL Aplikasi Web (/exec)</label>
            <input type="url" id="gasUrlInput" placeholder="https://script.google.com/macros/s/.../exec" />
          </div>
          <button type="button" id="btnSaveUrl" class="btn btn-primary">Simpan URL G-Drive</button>
        </div>
      </section>
    </div>

    <div id="toast" class="toast"></div>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-nav="viewHome" data-title="Beranda">Beranda</button>
      <button class="nav-btn" data-nav="viewReports" data-title="Daftar Laporan">Laporan</button>
      <button class="nav-btn" data-nav="viewNotif" data-title="Notifikasi">Notifikasi</button>
      <button class="nav-btn" data-nav="viewProfile" data-title="Pengaturan">Profil</button>
    </nav>
  </div>

  <script>
    const STORAGE_REPORTS_KEY = 'csr_reports_v1';
    const STORAGE_GAS_URL_KEY = 'csr_gas_url_v1';

    let currentFilter = 'Semua';
    let previousView = { id: 'viewReports', title: 'Daftar Laporan' };
    let selectedImages = [];

    const views = ['viewHome', 'viewReports', 'viewDetail', 'viewNotif', 'viewProfile'];
    const topTitle = document.getElementById('topTitle');
    const btnBack = document.getElementById('btnBack');
    const toastEl = document.getElementById('toast');

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.style.display = 'block';
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toastEl.style.display = 'none';
      }, 2800);
    }

    function getReports() {
      try {
        const raw = localStorage.getItem(STORAGE_REPORTS_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveReports(list) {
      localStorage.setItem(STORAGE_REPORTS_KEY, JSON.stringify(list));
    }

    function getGasUrl() {
      return (localStorage.getItem(STORAGE_GAS_URL_KEY) || '').trim();
    }

    function switchView(viewId, title, showBack = false) {
      views.forEach((id) => {
        document.getElementById(id).classList.toggle('hidden', id !== viewId);
      });
      topTitle.textContent = title;
      btnBack.classList.toggle('hidden', !showBack);

      document.querySelectorAll('.nav-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.nav === viewId);
      });

      if (viewId === 'viewReports') {
        renderReports();
      } else if (viewId === 'viewProfile') {
        document.getElementById('gasUrlInput').value = getGasUrl();
      }
    }

    function formatDisplayDate(isoDate) {
      if (!isoDate) return '-';
      const parts = isoDate.split('-');
      if (parts.length !== 3) return isoDate;
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const day = parseInt(parts[2], 10);
      const month = months[parseInt(parts[1], 10) - 1] || parts[1];
      const year = parts[0];
      return `${day} ${month} ${year}`;
    }

    function readFilesAsDataUrl(files) {
      const fileArray = Array.from(files || []);
      return Promise.all(
        fileArray.map(
          (file) =>
            new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () =>
                resolve({
                  name: file.name,
                  mimeType: file.type || 'image/jpeg',
                  base64: reader.result
                });
              reader.onerror = reject;
              reader.readAsDataURL(file);
            })
        )
      );
    }

    function renderPreview() {
      const grid = document.getElementById('previewGrid');
      grid.innerHTML = '';
      selectedImages.forEach((img) => {
        const el = document.createElement('img');
        el.src = img.base64;
        el.alt = img.name;
        grid.appendChild(el);
      });
    }

    function renderReports() {
      const listEl = document.getElementById('reportList');
      const reports = getReports();
      const filtered =
        currentFilter === 'Semua'
          ? reports
          : reports.filter((item) => (item.status || 'Disetujui') === currentFilter);

      if (!filtered.length) {
        listEl.innerHTML = '<div class="empty-state">Belum ada laporan pada kategori ini.</div>';
        return;
      }

      listEl.innerHTML = '';
      filtered.forEach((report) => {
        const card = document.createElement('div');
        card.className = 'report-card';
        const firstImg = report.images && report.images[0] ? report.images[0].base64 : '';
        const imgCount = report.images ? report.images.length : 0;

        card.innerHTML = `
          ${firstImg ? `<img class="thumb" src="${firstImg}" alt="${report.namaKegiatan}" />` : `<div class="thumb"></div>`}
          <div class="report-meta">
            <div class="report-top">
              <span>${formatDisplayDate(report.tanggal)}</span>
              <span class="badge">&#10003; ${report.status || 'Disetujui'}</span>
            </div>
            <div class="report-title">${escapeHtml(report.namaKegiatan)}</div>
            <div class="report-sub">&#128205; ${escapeHtml(report.lokasi)} &bull; ${imgCount} Foto</div>
          </div>
          <div style="color: var(--text-muted); font-size: 18px;">&rsaquo;</div>
        `;

        card.addEventListener('click', () => openDetail(report.id));
        listEl.appendChild(card);
      });
    }

    function openDetail(reportId) {
      const reports = getReports();
      const report = reports.find((item) => String(item.id) === String(reportId));
      if (!report) {
        showToast('Laporan tidak ditemukan.');
        return;
      }

      previousView = { id: 'viewReports', title: 'Daftar Laporan' };
      const detailCard = document.getElementById('detailCard');
      const images = Array.isArray(report.images) ? report.images : [];

      detailCard.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <span style="font-size:13px; color:var(--text-muted);">${formatDisplayDate(report.tanggal)}</span>
          <span class="badge">&#10003; ${escapeHtml(report.status || 'Disetujui')}</span>
        </div>
        <h2 style="margin-bottom:6px;">${escapeHtml(report.namaKegiatan)}</h2>
        <div style="font-size:13px; color:var(--text-muted); margin-bottom:4px;">&#128205; ${escapeHtml(report.lokasi)}</div>
        <div style="font-size:13px; color:var(--text-muted); margin-bottom:14px;">Petugas: ${escapeHtml(report.petugas || '-')}</div>

        <h4 style="margin-bottom:6px; font-size:14px;">Informasi Kegiatan</h4>
        <div style="display:flex; gap:12px; font-size:14px; margin-bottom:14px;">
          <span style="color:var(--text-muted); min-width:70px;">Uraian</span>
          <span>: ${escapeHtml(report.uraian || '-')}</span>
        </div>

        <h4 style="margin-bottom:8px; font-size:14px;">Dokumentasi (${images.length} Foto)</h4>
        ${
          images.length
            ? images.map((img, idx) => `<img class="detail-photo" src="${img.base64}" alt="Foto ${idx + 1}" />`).join('')
            : '<p style="font-size:13px; color:var(--text-muted);">Tidak ada foto.</p>'
        }

        <button type="button" id="btnDeleteReport" class="btn btn-danger">Hapus Laporan</button>
      `;

      document.getElementById('btnDeleteReport').addEventListener('click', () => {
        deleteReport(report.id);
      });

      switchView('viewDetail', 'Detail Laporan', true);
    }

    function deleteReport(reportId) {
      const reports = getReports();
      const nextReports = reports.filter((item) => String(item.id) !== String(reportId));
      saveReports(nextReports);
      showToast('Laporan dihapus dari daftar lokal.');
      switchView('viewReports', 'Daftar Laporan', false);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    document.getElementById('fotoInput').addEventListener('change', async (e) => {
      selectedImages = await readFilesAsDataUrl(e.target.files);
      renderPreview();
    });

    document.getElementById('reportForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btnSubmit = document.getElementById('btnSubmitReport');
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Menyimpan...';

      const payload = {
        id: Date.now(),
        petugas: document.getElementById('petugas').value.trim(),
        tanggal: document.getElementById('tanggal').value,
        namaKegiatan: document.getElementById('namaKegiatan').value.trim(),
        lokasi: document.getElementById('lokasi').value.trim(),
        uraian: document.getElementById('uraian').value.trim(),
        status: 'Disetujui',
        images: selectedImages
      };

      const reports = getReports();
      reports.unshift(payload);
      saveReports(reports);

      const gasUrl = getGasUrl();
      if (gasUrl) {
        try {
          await fetch(gasUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
          showToast('Laporan & foto terkirim ke Google Drive!');
        } catch (err) {
          showToast('Tersimpan lokal, gagal mengirim ke Google Drive.');
        }
      } else {
        showToast('Laporan tersimpan lokal (URL G-Drive belum diatur).');
      }

      e.target.reset();
      document.getElementById('petugas').value = 'Muhamad Abdul Azis';
      document.getElementById('tanggal').value = new Date().toISOString().slice(0, 10);
      selectedImages = [];
      renderPreview();

      btnSubmit.disabled = false;
      btnSubmit.textContent = 'Simpan Laporan';
      switchView('viewReports', 'Daftar Laporan', false);
    });

    document.getElementById('btnSaveUrl').addEventListener('click', () => {
      const url = document.getElementById('gasUrlInput').value.trim();
      localStorage.setItem(STORAGE_GAS_URL_KEY, url);
      showToast('URL Google Drive berhasil disimpan!');
    });

    document.querySelectorAll('.filter-pill').forEach((pill) => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.filter-pill').forEach((p) => p.classList.remove('active'));
        pill.classList.add('active');
        currentFilter = pill.dataset.filter;
        renderReports();
      });
    });

    document.querySelectorAll('.nav-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        switchView(btn.dataset.nav, btn.dataset.title, false);
      });
    });

    btnBack.addEventListener('click', () => {
      switchView(previousView.id, previousView.title, false);
    });

    document.getElementById('tanggal').value = new Date().toISOString().slice(0, 10);
    renderReports();
  </script>
</body>
</html>
